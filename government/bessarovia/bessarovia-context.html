
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenario and context</title>

  <style>
    body {
      margin: 0;
      padding: 40px 15px;
      background: #eeeeee;
      font-family: Arial, sans-serif;
      color: #111;
      line-height: 1.6;
    }

    .document {
      background: white;
      max-width: 800px;
      margin: 0 auto;
      padding: 60px;
      box-shadow: 0 2px 12px #00000020;
      box-sizing: border-box;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      margin-top: 30px;
    }

    p, li {
      font-size: 14px;
    }

    .subtitle {
      color: #555;
      font-size: 13px;
    }

    .map {
      width: 100%;
      height: auto;
      margin: 20px 0;
    }

    .footer {
      border-top: 1px solid #ccc;
      margin-top: 40px;
      padding-top: 10px;
      font-size: 11px;
      color: #777;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .document {
        box-shadow: none;
        max-width: none;
        padding: 15mm;
      }
    }

    @media (max-width: 600px) {
      .document {
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="document">

    <h1>Bessarovia</h1>
    <p class="subtitle">
      Country profile, objectives, and every other relevant information. 
    </p>

    <hr>

    <h2>h2</h2>

    <p>
      The Republic of Aldeia and the Federation of
      Bessarovia have competing claims over their
      maritime boundary.
    </p>

   

    <img
      class="map"

      alt="Map of the maritime boundary dispute"
    >

   

    <div class="footer">
    — END OF BRIEF — STATE SECRET — ALDEIA EYES ONLY —

    </div>

  </main>
</body>
</html>
