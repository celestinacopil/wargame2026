<!doctype html>
<html lang="en">
  
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Team access | Arctic Crisis</title>
  <link rel="stylesheet" href="assets/style.css"><script src="assets/config.js" defer></script><script src="assets/portal.js" defer></script>
  </head>
  
<body data-page="login"><main class="container">
  <header class="masthead">
    <div><p class="eyebrow">Wargame 2026 / Arctic Crisis</p>
      <a class="brand" href="index.html">ARCTIC CRISIS</a>
    </div><button class="button" type="button" data-logout hidden>Exit space</button>
  </header><h1>Choose your space</h1>
  <p class="muted">Select your country and team. Enter the password provided by the organisers.</p>
  
  <section id="role-grid" class="grid" aria-label="Team spaces">
    <button type="button" class="card" data-choice="darsenia-government">
      <span class="tag blue">Darsenia</span>
      <h2>Government</h2>
      <p>Enter your dedicated team space.</p>
    </button>
    <button type="button" class="card" data-choice="darsenia-cyber">
      <span class="tag blue">Darsenia</span>
      <h2>Cyber team</h2>
      <p>Enter your dedicated team space.</p>
    </button>
    <button type="button" class="card" data-choice="belvaria-government">
      <span class="tag red">Belvaria</span>
      <h2>Government</h2>
      <p>Enter your dedicated team space.</p>
    </button>
    <button type="button" class="card" data-choice="belvaria-cyber">
      <span class="tag red">Belvaria</span><h2>Cyber team</h2>
      <p>Enter your dedicated team space.</p>
    </button>
  </section>
  
  <section id="login-panel" class="panel login" hidden>
    <h2 id="login-title"></h2>
    <form id="login-form">
      <label for="password">Team password</label>
      <input id="password" type="password" autocomplete="current-password" aria-describedby="login-message" required>
      <p id="login-message" class="message" role="alert"></p>
      <div class="actions">
        <button type="submit" class="button primary">Enter space</button>
        <button type="button" class="button" id="change-role">Change team</button>
      </div>
    </form></section>
  <noscript>
    <p class="panel">Enable JavaScript to use this portal.</p>
  </noscript>
  
  <footer>Fictional wargame. Use only your assigned space. Flags are checked locally and are not sent to organisers.</footer>
</main>
</body>
</html>
